const TOTAL=75*60;let s={started:false,submitted:false,current:0,answers:{},left:TOTAL};let timer;
const app=document.getElementById('app');
const esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const fmt=()=>String(Math.floor(s.left/60)).padStart(2,'0')+':'+String(s.left%60).padStart(2,'0');
function start(){s.started=true;render();timer=setInterval(()=>{s.left--;if(s.left<=0)submit();else document.getElementById('timer').textContent=fmt()},1000)}
function pick(i){s.answers[QUESTIONS[s.current].id]=i;render()}
function go(i){if(i>=0&&i<QUESTIONS.length){s.current=i;render()}}
function submit(){clearInterval(timer);s.submitted=true;render();scrollTo(0,0)}
function restart(){clearInterval(timer);s={started:false,submitted:false,current:0,answers:{},left:TOTAL};render();scrollTo(0,0)}
async function copyResult(){await navigator.clipboard.writeText(document.getElementById('summary').textContent);const b=document.getElementById('copy');b.textContent='복사 완료';setTimeout(()=>b.textContent='결과 복사',1400)}
function render(){
 if(!s.started){app.innerHTML=`<main class="wrap"><section class="card intro"><div class="brand">PEARL ABYSS · WEB BACKEND</div><h1>웹 백엔드 필기<br>모의고사 1회</h1><p class="lead">객관식 25문항 · 75분. 자료구조/알고리즘, DB/SQL, Web/Network, OS/CS, C#/.NET을 함께 평가합니다. 제출 전에는 정답과 해설을 공개하지 않습니다.</p><div class="meta"><span>25문항</span><span>75분</span><span>5개 영역</span></div><button class="btn" onclick="start()">시험 시작</button></section></main>`;return}
 if(s.submitted){const score=QUESTIONS.filter(q=>s.answers[q.id]===q.answer).length,pct=Math.round(score/QUESTIONS.length*100),cats={};for(const q of QUESTIONS){cats[q.category]??={c:0,t:0};cats[q.category].t++;if(s.answers[q.id]===q.answer)cats[q.category].c++}const missed=QUESTIONS.filter(q=>s.answers[q.id]!==q.answer);const summary=`펄어비스 웹 백엔드 모의필기 1회 결과\n총점: ${score}/${QUESTIONS.length} (${pct}%)\n영역: ${Object.entries(cats).map(([k,v])=>`${k} ${v.c}/${v.t}`).join(', ')}\n오답: ${missed.map(q=>`${q.id}(${q.category})`).join(', ')||'없음'}\n이 결과를 기준으로 오답 개념부터 바로 학습시켜줘.`;app.innerHTML=`<main class="wrap"><section class="card"><div class="brand">RESULT</div><div class="result">${score}/${QUESTIONS.length}</div><p>${pct}% · 미응답 ${QUESTIONS.filter(q=>s.answers[q.id]===undefined).length}문항</p><div class="category">${Object.entries(cats).map(([k,v])=>`<div><b>${k}</b><br>${v.c}/${v.t}</div>`).join('')}</div></section><section class="card" style="margin-top:20px"><h2>오답 해설</h2>${missed.length?missed.map(q=>`<article class="review"><b>Q${q.id} · ${q.category}</b><h3>${esc(q.prompt)}</h3><p><b>정답 ${q.answer+1}.</b> ${esc(q.choices[q.answer])}</p><p class="muted">${esc(q.explanation)}</p><p>학습 포인트 · ${esc(q.lesson)}</p></article>`).join(''):'<p>전 문항 정답입니다.</p>'}</section><section class="card" style="margin-top:20px"><h2>Codex에서 바로 보충 학습</h2><div id="summary" class="copybox">${esc(summary)}</div><div class="actions"><button id="copy" class="btn" onclick="copyResult()">결과 복사</button><button class="btn" onclick="restart()">다시 응시</button><a class="link" href="./">포트폴리오로 돌아가기</a></div></section></main>`;return}
 const q=QUESTIONS[s.current];app.innerHTML=`<header class="top"><div class="brand">PEARL ABYSS · WEB BACKEND</div><div id="timer" class="timer">${fmt()}</div><button class="btn" onclick="submit()">답안 제출</button></header><main class="wrap exam"><section class="card"><div class="qmeta">Q${q.id} · ${q.category}</div><h1 class="qtitle">${esc(q.prompt)}</h1>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}${q.choices.map((c,i)=>`<div class="choice ${s.answers[q.id]===i?'sel':''}" onclick="pick(${i})"><b>${i+1}</b><span>${esc(c)}</span></div>`).join('')}<div class="nav"><button ${s.current===0?'disabled':''} onclick="go(${s.current-1})">이전</button><button ${s.current===QUESTIONS.length-1?'disabled':''} onclick="go(${s.current+1})">다음</button></div></section><aside class="card"><b>답안 현황 ${Object.keys(s.answers).length}/${QUESTIONS.length}</b><div class="palette">${QUESTIONS.map((x,i)=>`<button class="${s.answers[x.id]!==undefined?'ans ':''}${s.current===i?'cur':''}" onclick="go(${i})">${x.id}</button>`).join('')}</div></aside></main>`}
render();
</script></body></html>

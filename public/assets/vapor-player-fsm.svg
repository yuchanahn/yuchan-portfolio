<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Vapor player finite state machine</title>
  <desc id="desc">Player movement and combat states transition around idle with hit and death taking priority.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#242522"/></marker>
    <style>
      .bg{fill:#fafaf7}.box{fill:#fff;stroke:#c9cbc4;stroke-width:2}.dark{fill:#20211f}.line{fill:none;stroke:#242522;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#979a93;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .eyebrow{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#666962}.title{font:800 31px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171817}
      .label{font:750 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#20211f}.small{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#686b65}.inverse{font:750 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text class="eyebrow" x="56" y="58">PLAYER FSM</text>
  <text class="title" x="56" y="98">Movement and combat share explicit enter, update, and exit behavior</text>

  <rect class="dark" x="504" y="240" width="192" height="104" rx="18"/><text class="inverse" x="573" y="285">Idle</text><text class="small" x="554" y="316" style="fill:#d7d8d2">default state</text>

  <rect class="box" x="76" y="164" width="158" height="76" rx="15"/><text class="label" x="126" y="209">Move</text>
  <rect class="box" x="76" y="270" width="158" height="76" rx="15"/><text class="label" x="122" y="315">Jump</text>
  <rect class="box" x="76" y="376" width="158" height="76" rx="15"/><text class="label" x="128" y="421">Fall</text>

  <rect class="box" x="966" y="126" width="158" height="76" rx="15"/><text class="label" x="1001" y="171">Attack</text>
  <rect class="box" x="966" y="222" width="158" height="76" rx="15"/><text class="label" x="1003" y="267">Charge</text>
  <rect class="box" x="966" y="318" width="158" height="76" rx="15"/><text class="label" x="986" y="363">Charge attack</text>
  <rect class="box" x="966" y="414" width="158" height="76" rx="15"/><text class="label" x="1014" y="459">Roll</text>

  <rect class="box" x="348" y="452" width="158" height="76" rx="15"/><text class="label" x="384" y="497">Defence</text>
  <rect class="box" x="521" y="452" width="158" height="76" rx="15"/><text class="label" x="574" y="497">Hit</text>
  <rect class="box" x="694" y="452" width="158" height="76" rx="15"/><text class="label" x="744" y="497">Die</text>

  <path class="line" d="M504 270L234 202"/><path class="line" d="M504 292H234"/><path class="line" d="M504 318L234 414"/>
  <path class="line" d="M696 262L966 164"/><path class="line" d="M696 282L966 260"/><path class="line" d="M696 306L966 356"/><path class="line" d="M696 326L966 452"/>
  <path class="dash" d="M554 344L445 452"/><path class="dash" d="M600 344V452"/><path class="dash" d="M646 344L773 452"/>

  <text class="small" x="56" y="566">Hit and death guards are checked across movement and combat transitions.</text>
</svg>

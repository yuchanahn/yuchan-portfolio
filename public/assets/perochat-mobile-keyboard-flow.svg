<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">iPhone keyboard candidate comparison and selected focus flow</title>
  <desc id="desc">A diagram showing an iPhone browser viewport being pushed by the software keyboard, candidate fixes compared side by side, and the selected approach that separates the visible input from the real focused input while compensating with visualViewport metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="92" y="92" font-family="Inter, Pretendard, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">iPhone 입력창 문제 · 후보 비교 실험</text>
  <text x="92" y="136" font-family="Inter, Pretendard, Arial, sans-serif" font-size="20" fill="#64748b">화면 전체가 밀리는 원인을 실제 기기에서 비교하고, 포커스와 위치 보정을 분리했습니다.</text>

  <g transform="translate(92 190)">
    <rect width="500" height="610" rx="34" fill="#ffffff" stroke="#dbe3ec" stroke-width="2" filter="url(#shadow)"/>
    <text x="38" y="54" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569">문제 상황</text>
    <text x="38" y="90" font-family="Inter, Pretendard, Arial, sans-serif" font-size="27" font-weight="750" fill="#0f172a">키보드가 열리면<br/>캐릭터 화면 전체가 위로 밀림</text>

    <g transform="translate(120 140)">
      <rect width="260" height="420" rx="38" fill="#0f172a"/>
      <rect x="10" y="12" width="240" height="396" rx="30" fill="#f8fafc"/>
      <rect x="82" y="22" width="96" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="28" y="58" width="204" height="176" rx="24" fill="#e2e8f0"/>
      <circle cx="130" cy="128" r="42" fill="#cbd5e1"/>
      <path d="M96 182c16-24 52-24 68 0" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
      <rect x="28" y="248" width="204" height="48" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="48" y="279" font-family="Inter, Pretendard, Arial, sans-serif" font-size="15" fill="#94a3b8">메시지 입력...</text>
      <path d="M130 328v-24" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      <path d="M116 314l14-14 14 14" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="10" y="318" width="240" height="90" rx="0 0 30 30" fill="#e5e7eb"/>
      <g fill="#ffffff">
        <rect x="24" y="334" width="28" height="22" rx="5"/><rect x="58" y="334" width="28" height="22" rx="5"/><rect x="92" y="334" width="28" height="22" rx="5"/><rect x="126" y="334" width="28" height="22" rx="5"/><rect x="160" y="334" width="28" height="22" rx="5"/><rect x="194" y="334" width="28" height="22" rx="5"/>
        <rect x="38" y="364" width="44" height="22" rx="5"/><rect x="88" y="364" width="84" height="22" rx="5"/><rect x="178" y="364" width="44" height="22" rx="5"/>
      </g>
    </g>

    <rect x="38" y="552" width="424" height="36" rx="18" fill="#fff1f2"/>
    <text x="58" y="576" font-family="Inter, Pretendard, Arial, sans-serif" font-size="15" font-weight="650" fill="#be123c">iOS viewport 이동 + 포커스 스크롤이 동시에 발생</text>
  </g>

  <g transform="translate(636 190)">
    <rect width="872" height="270" rx="30" fill="#ffffff" stroke="#dbe3ec" stroke-width="2" filter="url(#shadow)"/>
    <text x="34" y="48" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569">후보 비교 화면</text>
    <text x="34" y="82" font-family="Inter, Pretendard, Arial, sans-serif" font-size="24" font-weight="750" fill="#0f172a">3~4개 방식을 한 화면에 넣고 같은 iPhone에서 바로 비교</text>

    <g transform="translate(34 118)">
      <rect width="188" height="98" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="20" y="32" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">01</text>
      <text x="20" y="62" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CSS 고정</text>
      <text x="20" y="84" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" fill="#94a3b8">position / inset</text>
    </g>
    <g transform="translate(236 118)">
      <rect width="188" height="98" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="20" y="32" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">02</text>
      <text x="20" y="62" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">viewport 보정</text>
      <text x="20" y="84" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" fill="#94a3b8">visualViewport</text>
    </g>
    <g transform="translate(438 118)">
      <rect width="188" height="98" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="20" y="32" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">03 · 선택</text>
      <text x="20" y="62" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="750" fill="#0f172a">포커스 분리</text>
      <text x="20" y="84" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" fill="#64748b">display ↔ real input</text>
    </g>
    <g transform="translate(640 118)">
      <rect width="198" height="98" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="20" y="32" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">04</text>
      <text x="20" y="62" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">wrapper 이동</text>
      <text x="20" y="84" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" fill="#94a3b8">translateY</text>
    </g>
  </g>

  <g transform="translate(636 492)">
    <rect width="872" height="308" rx="30" fill="#0f172a" filter="url(#shadow)"/>
    <text x="34" y="46" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" font-weight="700" fill="#93c5fd">선택한 구현</text>
    <text x="34" y="82" font-family="Inter, Pretendard, Arial, sans-serif" font-size="25" font-weight="750" fill="#ffffff">보이는 입력창과 실제 포커스 대상을 분리하고 필요한 만큼만 이동</text>

    <g transform="translate(36 126)">
      <rect width="198" height="108" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="22" y="38" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" fill="#94a3b8">사용자 터치</text>
      <text x="22" y="72" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">표시용 입력창</text>
      <text x="22" y="95" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" fill="#cbd5e1">화면 위치 유지</text>
    </g>
    <path d="M250 180h54" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M294 168l14 12-14 12" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(320 126)">
      <rect width="230" height="108" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="22" y="38" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" fill="#94a3b8">실제 focus</text>
      <text x="22" y="72" font-family="monospace" font-size="16" font-weight="700" fill="#dbeafe">realInput.focus()</text>
      <text x="22" y="95" font-family="monospace" font-size="13" fill="#93c5fd">preventScroll: true</text>
    </g>
    <path d="M566 180h54" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M610 168l14 12-14 12" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(636 126)">
      <rect width="200" height="108" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="22" y="38" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" fill="#94a3b8">키보드 높이 계산</text>
      <text x="22" y="68" font-family="monospace" font-size="13" fill="#dbeafe">innerHeight</text>
      <text x="22" y="88" font-family="monospace" font-size="13" fill="#dbeafe">visualViewport</text>
    </g>

    <rect x="36" y="252" width="800" height="32" rx="16" fill="#172554"/>
    <text x="56" y="274" font-family="Inter, Pretendard, Arial, sans-serif" font-size="14" font-weight="650" fill="#bfdbfe">결과: 전체 화면 대신 입력 wrapper만 보정하고, 닫힐 때 남은 offset도 복귀</text>
  </g>
</svg>
